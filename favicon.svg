<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glowG">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#09090b" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="3"/>
  <!-- 5-Point Star -->
  <polygon points="50,15 61,38 86,41 68,58 73,83 50,71 27,83 32,58 14,41 39,38" fill="url(#gold)" filter="url(#glowG)"/>
</svg>