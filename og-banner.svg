<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <linearGradient id="brandGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bgG)"/>
  
  <!-- Outer Glow Border -->
  <rect x="20" y="20" width="1160" height="590" rx="20" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- Badge -->
  <rect x="100" y="100" width="340" height="46" rx="23" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="130" y="130" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" letter-spacing="2">⭐ MANHWA CRITIC GUILD</text>
  
  <!-- Main Title -->
  <text x="100" y="220" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">MANHWA <tspan fill="url(#brandGold)">REVIEWS</tspan></text>
  <text x="100" y="290" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="500">Authoritative Editorial Ratings, Story Analysis &amp; 9.2/10 Scores</text>
  
  <!-- Metrics Badges -->
  <g transform="translate(100, 360)">
    <rect width="200" height="90" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
    <text x="24" y="40" fill="#fbbf24" font-family="sans-serif" font-size="28" font-weight="800">1,880+</text>
    <text x="24" y="68" fill="#71717a" font-family="sans-serif" font-size="14" font-weight="600">Critic Reviews</text>
  </g>
  
  <g transform="translate(330, 360)">
    <rect width="220" height="90" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
    <text x="24" y="40" fill="#f43f5e" font-family="sans-serif" font-size="28" font-weight="800">9.2 / 10</text>
    <text x="24" y="68" fill="#71717a" font-family="sans-serif" font-size="14" font-weight="600">Average Rating</text>
  </g>
  
  <g transform="translate(580, 360)">
    <rect width="240" height="90" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
    <text x="24" y="40" fill="#38bdf8" font-family="sans-serif" font-size="28" font-weight="800">Verified</text>
    <text x="24" y="68" fill="#71717a" font-family="sans-serif" font-size="14" font-weight="600">Rich Review Stars</text>
  </g>
  
  <!-- Footer Brand -->
  <text x="100" y="540" fill="#71717a" font-family="sans-serif" font-size="16">Official Satellite Platform of ToonCraze.com &bull; Hosted on GitHub Pages</text>
</svg>